name: Audit explicit crafting requirements
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit-questing-craft-skills.py
      - .github/workflows/audit-questing-craft-skills.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/audit-questing-craft-skills.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questing-crafting-skills.json
          git diff --cached --quiet || (git commit -m "data: cross-check minimum crafting levels in Questing Forever database" && git push)
