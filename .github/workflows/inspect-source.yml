name: Inspect recipe source
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect-source.py"
      - "scripts/build-data.py"
      - ".github/workflows/inspect-source.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspect-source.py
      - run: python scripts/build-data.py
      - name: Commit data shape
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source-shape.json data/leatherworking.json
          git diff --cached --quiet || (git commit -m "data: refresh client-derived Leatherworking catalog" && git push)
