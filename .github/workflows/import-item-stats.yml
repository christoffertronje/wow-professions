name: Import WoW Forever rare item stats
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-item-stats.py
      - data/item-stats-corrections.json
      - .github/workflows/import-item-stats.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - name: Import item stats
        run: python3 scripts/build-item-stats.py
      - name: Validate imported item stats
        run: python3 scripts/validate-item-stats.py
      - name: Commit item data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/item-stats.json
          git diff --cached --quiet || (git commit -m "data: import 201 Forever rare item tooltips by item ID" && git push)
