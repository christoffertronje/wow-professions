name: Compare all 201 rare item stats with newer client
on:
  push:
    paths:
      - scripts/audit-rare-second-source.py
      - .github/workflows/audit-rare-second-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/audit-rare-second-source.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rare-stats-second-source-audit.json
          git diff --cached --quiet || (git commit -m "docs: audit all 201 rare stats against newer Forever client" && git push)
