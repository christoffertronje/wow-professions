name: Inspect Forever Talent recipe markup
on:
  push:
    paths:
      - scripts/inspect-talent.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect-talent.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/talent-markup-probe.txt
          git diff --cached --quiet || (git commit -m "chore: inspect external skill-page markup" && git push)
