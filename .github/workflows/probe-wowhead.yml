name: Check Wowhead recipe list accessibility
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe-wowhead.py
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe-wowhead.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/wowhead-direct-access.json
          git diff --cached --quiet || (git commit -m "docs: record Wowhead direct recipe-access audit" && git push)
