name: Inspect rare recipe material markup
on:
  push:
    paths:
      - scripts/inspect-rare-talent-layout.py
      - .github/workflows/inspect-rare-talent-layout.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/inspect-rare-talent-layout.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rare-talent-layout.json
          git diff --cached --quiet || (git commit -m "docs: inspect independent rare recipe materials markup" && git push)
