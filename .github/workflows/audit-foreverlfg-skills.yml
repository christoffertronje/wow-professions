name: Compare recipe required skills against ForeverLFG
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit-foreverlfg-skills.py
      - .github/workflows/audit-foreverlfg-skills.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/audit-foreverlfg-skills.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/foreverlfg-crafting-crosscheck.json
          git diff --cached --quiet || (git commit -m "docs: audit recipe skill sources against ForeverLFG" && git push)
