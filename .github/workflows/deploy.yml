name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import recorded learning requirements
        run: python3 scripts/import-learning-skills.py
      - name: Build verified crafting requirement lookup
        run: python3 scripts/build-verified-crafting-skills.py
      - name: Build static client recipe catalog
        run: python3 scripts/build-data.py
      - name: Validate minimum crafting skills
        run: python3 scripts/validate-crafting-skills.py
      - name: Validate Rare item stats
        run: python3 scripts/validate-item-stats.py
      - name: Resolve item icons from WoW FileDataIDs
        run: python3 scripts/resolve-icons.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
