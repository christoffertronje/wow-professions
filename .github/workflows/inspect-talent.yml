name: Inspect Forever Talent recipe markup
on:
  push:
    paths:
      - scripts/inspect-talent.py
      - scripts/import-learning-skills.py
      - scripts/crosscheck-70862.py
      - .github/workflows/inspect-talent.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect-talent.py
      - run: python3 scripts/import-learning-skills.py
      - run: python3 scripts/crosscheck-70862.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/talent-markup-probe.txt data/leatherworking-skills.json data/forever-70862-skill-crosscheck.json
          git diff --cached --quiet || (git commit -m "data: record ID-matched learning skill requirements" && git push)
