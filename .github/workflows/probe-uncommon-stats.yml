name: Probe Uncommon item stats source
on:
  push:
    paths:
      - scripts/probe-uncommon-stats.py
      - .github/workflows/probe-uncommon-stats.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/probe-uncommon-stats.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/uncommon-stats-source-probe.json
          git diff --cached --quiet || (git commit -m "docs: inspect Uncommon output stats coverage" && git push)
