name: Audit client skill fields
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit-skill-fields.py"
      - ".github/workflows/audit-skill-fields.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit-skill-fields.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/skill-field-audit.json
          git diff --cached --quiet || (git commit -m "docs: audit raw skill-line field distributions" && git push)
