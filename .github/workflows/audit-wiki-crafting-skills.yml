name: Cross-check Wiki crafting requirements
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit-wiki-crafting-skills.py
      - .github/workflows/audit-wiki-crafting-skills.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/audit-wiki-crafting-skills.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || (git commit -m "docs: compare wiki crafting levels and isolate conflicts" && git push)
