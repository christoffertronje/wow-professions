name: Inspect EG Link Leatherworking evidence
on:
  push:
    paths:
      - scripts/inspect-eglink-details.py
      - .github/workflows/inspect-eglink-details.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/inspect-eglink-details.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || (git commit -m "docs: inspect in-game trainer observation fields" && git push)
