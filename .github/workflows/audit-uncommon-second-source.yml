name: Verify 213 Uncommon item stats with newer Forever client
on:
  push:
    paths:
      - scripts/audit-uncommon-second-source.py
      - .github/workflows/audit-uncommon-second-source.yml
      - data/item-stats.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/audit-uncommon-second-source.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/uncommon-stats-second-source-audit.json
          git diff --cached --quiet || (git commit -m "docs: compare all 213 Uncommon tooltip fields" && git push)
