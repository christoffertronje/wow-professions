name: Resolve remaining Leatherworking skills
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/resolve-remaining-skills.py"
      - ".github/workflows/resolve-remaining-skills.yml"
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check beautifulsoup4
      - run: python3 scripts/resolve-remaining-skills.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leatherworking-skills-extra.json docs/playfulls-parse-diagnostic.json
          git diff --cached --quiet || (git commit -m "data: add extra matched skill cross-check values" && git push)
