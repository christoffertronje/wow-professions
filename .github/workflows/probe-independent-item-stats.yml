name: Inspect second-source Forever item details
on:
  push:
    paths:
      - scripts/probe-independent-item-stats.py
      - .github/workflows/probe-independent-item-stats.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/probe-independent-item-stats.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rare-independent-source-probe.json
          git diff --cached --quiet || (git commit -m "docs: inspect independent Forever item tooltip sources" && git push)
