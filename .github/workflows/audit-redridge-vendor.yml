name: Audit Redridge Leatherworking vendor
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit-redridge-vendor.py
      - .github/workflows/audit-redridge-vendor.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/audit-redridge-vendor.py
      - name: Publish audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daniel-stitchsong-recipe-audit.json
          git diff --cached --quiet || (git commit -m "docs: audit Redridge Leatherworking vendor recipe skills" && git push)
