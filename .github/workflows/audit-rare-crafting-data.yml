name: Audit rare Leatherworking skill and materials
on:
  push:
    paths:
      - scripts/audit-rare-crafting-data.py
      - .github/workflows/audit-rare-crafting-data.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/audit-rare-crafting-data.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rare-crafting-material-skill-audit.json
          git diff --cached --quiet || (git commit -m "docs: compare 201 rare crafting requirements and reagents" && git push)
