name: Inspect Warcraft Wiki recipe table
on:
  push:
    paths:
      - scripts/inspect-wiki-table.py
      - .github/workflows/inspect-wiki-table.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/inspect-wiki-table.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/wiki-table-shape.json
          git diff --cached --quiet || (git commit -m "docs: inspect wiki recipe skill table schema" && git push)
