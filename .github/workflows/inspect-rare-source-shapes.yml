name: Inspect independent rare recipe sources
on:
  push:
    paths:
      - scripts/inspect-rare-source-shapes.py
      - .github/workflows/inspect-rare-source-shapes.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/inspect-rare-source-shapes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rare-source-html-shapes.json
          git diff --cached --quiet || (git commit -m "docs: inspect rare Leatherworking recipe source HTML" && git push)
