name: Inspect Forever crafting tables
on:
  push:
    paths:
      - scripts/probe-two-skill-tables.py
      - .github/workflows/probe-two-skill-tables.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4
      - run: python3 scripts/probe-two-skill-tables.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source-table-shapes.json
          git diff --cached --quiet || (git commit -m "docs: inspect independent crafting skill table structure" && git push)
